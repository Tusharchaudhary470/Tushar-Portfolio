<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A3E" />
      <stop offset="50%" stop-color="#DC1428" />
      <stop offset="100%" stop-color="#9C0A18" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEEEEE" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Bold Geometric Monogram 'T' -->
  <path 
    d="M15 15 H49 V25.5 H37 V49 H27 V25.5 H15 Z" 
    fill="url(#textGrad)" 
    filter="url(#shadow)" 
  />

  <!-- Pulsing Online Emerald Dot (Mirrors the Portfolio Status) -->
  <circle cx="49" cy="15" r="5" fill="#10B981" stroke="#DC1428" stroke-width="2" />
</svg>